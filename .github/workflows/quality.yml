name: Theme quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax validation
        run: find . -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Static regression suite
        run: php tests/test-theme.php
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax validation
        run: find assets/js -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Resolve dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Dependency advisory check
        run: npm audit --audit-level=high
